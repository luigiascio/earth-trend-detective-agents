[project]
name = "earth-trend-detective"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.14.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pymannkendall>=1.4.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
